name: CI Smoke Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write build artifact
        run: |
          echo "CI smoke test build output" > build-output.txt
          echo "artifact: demo-build" >> build-output.txt
          echo "generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build-output.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: build-output.txt
